<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#1a1d29">
<meta name="description" content="Throttle Hills: a dirt-bike physics game. Twelve tracks, flips, checkpoints and three stars to earn on every level.">
<title>Throttle Hills</title>
<link rel="icon" href="icon.svg">
<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #1a1d29; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #fff;
  user-select: none; -webkit-user-select: none; touch-action: none; overscroll-behavior: none; }
canvas { display: block; position: fixed; inset: 0; }
[hidden] { display: none !important; }
.screen { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 20px;
  padding-left: max(20px, env(safe-area-inset-left)); padding-right: max(20px, env(safe-area-inset-right)); text-align: center; }
.dim { background: rgba(10, 12, 24, .62); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); }
h1 { font: 900 clamp(44px, 10vw, 96px)/.9 system-ui, sans-serif; margin: 0; letter-spacing: -.02em; text-transform: uppercase; font-style: italic;
  color: #fff; text-shadow: 0 4px 0 #b8400a, 0 8px 18px rgba(0,0,0,.35); }
h1 b { color: #ff7a1f; display: block; text-shadow: 0 4px 0 #6b1f00, 0 8px 18px rgba(0,0,0,.35); }
h2 { margin: 0; font: 900 clamp(28px, 6vw, 44px) system-ui; font-style: italic; text-transform: uppercase; }
.tag { color: #ffe1c4; font-weight: 700; margin: 0; text-shadow: 0 2px 6px rgba(0,0,0,.4); }
.btn { font: 900 20px system-ui; border: 0; border-radius: 14px; padding: 14px 26px; color: #1a1d29; background: #ffd23a; cursor: pointer;
  box-shadow: 0 5px 0 #b58c00; text-transform: uppercase; letter-spacing: .03em; }
.btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #b58c00; }
.btn.big { font-size: 26px; padding: 16px 44px; }
.btn.ghost { background: rgba(255,255,255,.14); color: #fff; box-shadow: 0 5px 0 rgba(0,0,0,.35); }
.row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
.keys { font-size: 14px; opacity: .85; max-width: 520px; line-height: 1.5; }
.keys kbd { background: rgba(255,255,255,.18); border-radius: 5px; padding: 1px 6px; font: 700 13px system-ui; }
#levels { justify-content: flex-start; overflow-y: auto; touch-action: pan-y; padding-top: max(16px, env(safe-area-inset-top)); }
.lv-head { padding-right: 56px; display: flex; align-items: center; gap: 14px; width: 100%; max-width: 860px; }
.lv-head h2 { flex: 1; text-align: left; }
#total { font-weight: 900; color: #ffd23a; }
#grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; width: 100%; max-width: 860px; padding-bottom: 20px; }
.lvl { position: relative; border: 0; border-radius: 16px; padding: 12px 12px 10px; color: #fff; text-align: left; cursor: pointer; min-height: 104px;
  display: flex; flex-direction: column; gap: 2px; box-shadow: inset 0 -5px 0 rgba(0,0,0,.25); font-family: inherit; }
.lvl.dunes { background: linear-gradient(160deg, #ff9a4a, #c45f22); } .lvl.forest { background: linear-gradient(160deg, #4fb35a, #23683a); }
.lvl.canyon { background: linear-gradient(160deg, #e0603c, #8a2c1a); } .lvl.night { background: linear-gradient(160deg, #3a4f9a, #151d40); }
.lvl.locked { filter: grayscale(.85) brightness(.6); cursor: default; }
.lvl .n { font: 900 28px system-ui; line-height: 1; } .lvl .t { font-weight: 800; font-size: 15px; }
.lvl .s { color: #ffd23a; font-size: 20px; letter-spacing: 2px; } .lvl .s i { color: rgba(0,0,0,.3); font-style: normal; }
.lvl .b { position: absolute; top: 12px; right: 12px; font-size: 12px; font-weight: 700; opacity: .85; }
#hud { position: fixed; top: 0; left: 0; right: 0; display: flex; align-items: center; gap: 10px; padding: 10px 12px;
  padding-top: max(10px, env(safe-area-inset-top)); padding-left: max(12px, env(safe-area-inset-left)); padding-right: max(12px, env(safe-area-inset-right)); pointer-events: none; }
#hud > * { pointer-events: auto; }
#lvname { font-weight: 800; text-shadow: 0 2px 4px rgba(0,0,0,.5); flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#time { font: 900 26px ui-monospace, Menlo, monospace; text-shadow: 0 2px 4px rgba(0,0,0,.5); min-width: 92px; text-align: right; }
.icon { width: 44px; height: 44px; border-radius: 12px; border: 0; background: rgba(0,0,0,.35); color: #fff; font-size: 20px; cursor: pointer; }
#controls { position: fixed; inset: 0; pointer-events: none; }
.pad { position: absolute; bottom: max(14px, env(safe-area-inset-bottom)); width: min(19vh, 92px); height: min(19vh, 92px); border-radius: 50%;
  background: rgba(255,255,255,.16); border: 3px solid rgba(255,255,255,.4); pointer-events: auto; display: flex; align-items: center; justify-content: center;
  font: 900 30px system-ui; color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,.4); touch-action: none; }
.pad.on { background: rgba(255,210,58,.55); border-color: #ffd23a; }
.pad small { font-size: 11px; position: absolute; bottom: -18px; font-weight: 800; opacity: .8; letter-spacing: .05em; }
.pad[data-pad=back] { left: max(14px, env(safe-area-inset-left)); }
.pad[data-pad=fwd] { left: calc(max(14px, env(safe-area-inset-left)) + min(19vh, 92px) + 14px); }
.pad[data-pad=gas] { right: max(14px, env(safe-area-inset-right)); background: rgba(53,208,127,.3); }
.pad[data-pad=brake] { right: calc(max(14px, env(safe-area-inset-right)) + min(19vh, 92px) + 14px); background: rgba(255,80,80,.25); }
@media (pointer: fine) { #controls { display: none; } }
.card { background: rgba(20,24,40,.85); border-radius: 22px; padding: 22px 26px; display: flex; flex-direction: column; gap: 10px; align-items: center; min-width: min(360px, 90vw); }
#d-stars { font-size: 56px; letter-spacing: 6px; color: rgba(255,255,255,.18); line-height: 1; }
#d-stars .got { color: #ffd23a; display: inline-block; animation: pop .35s both; }
@keyframes pop { 0% { transform: scale(0) rotate(-40deg); } 70% { transform: scale(1.3); } 100% { transform: scale(1); } }
#d-time { font: 900 44px ui-monospace, Menlo, monospace; }
.meta { opacity: .85; font-size: 15px; } #d-best { color: #ffd23a; font-weight: 800; }
#rotate { position: fixed; inset: 0; z-index: 20; background: #1a1d29; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 30px; text-align: center; }
#rotate .ph { width: 60px; height: 100px; border: 4px solid #fff; border-radius: 12px; animation: turn 1.6s ease-in-out infinite; }
@keyframes turn { 0%, 30% { transform: rotate(0); } 60%, 100% { transform: rotate(-90deg); } }
#paused #p-sound { font-size: 15px; padding: 10px 18px; }
#mute { position: fixed; top: max(12px, env(safe-area-inset-top)); right: max(12px, env(safe-area-inset-right)); z-index: 5; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="title" class="screen">
  <h1>Throttle<b>Hills</b></h1>
  <p class="tag">Twelve tracks. Big air. Don't land on your head.</p>
  <button class="btn big" id="play">Play</button>
  <p class="keys">Keyboard: <kbd>↑</kbd> gas · <kbd>↓</kbd> brake · <kbd>←</kbd> <kbd>→</kbd> lean · <kbd>R</kbd> restart · <kbd>P</kbd> pause<br>
    Flips take a second off your time.</p>
</div>

<div id="levels" class="screen dim" hidden>
  <div class="lv-head"><button class="icon" id="lv-back" aria-label="Back">←</button><h2>Tracks</h2><span id="total"></span></div>
  <div id="grid"></div>
</div>

<div id="hud" hidden>
  <button class="icon" id="pause" aria-label="Pause">❚❚</button>
  <button class="icon" id="restart" aria-label="Restart">↻</button>
  <span id="lvname"></span>
  <span id="time">0.00</span>
</div>

<div id="controls" hidden>
  <div class="pad" data-pad="back">↺<small>LEAN BACK</small></div>
  <div class="pad" data-pad="fwd">↻<small>LEAN FWD</small></div>
  <div class="pad" data-pad="brake">◀<small>BRAKE</small></div>
  <div class="pad" data-pad="gas">▶<small>GAS</small></div>
</div>

<div id="paused" class="screen dim" hidden>
  <h2>Paused</h2>
  <div class="row"><button class="btn" id="p-resume">Resume</button><button class="btn ghost" id="p-restart">Restart</button><button class="btn ghost" id="p-levels">Tracks</button></div>
  <button class="btn ghost" id="p-sound">Sound: on</button>
</div>

<div id="done" class="screen dim" hidden>
  <div class="card">
    <h2 id="d-title">Finished!</h2>
    <div id="d-stars"></div>
    <div id="d-time"></div>
    <div id="d-best"></div>
    <div class="meta"><span id="d-flips"></span> · <span id="d-crashes"></span></div>
    <div class="meta" id="d-par"></div>
    <div class="row"><button class="btn" id="d-next">Next ▶</button><button class="btn ghost" id="d-retry">Retry</button><button class="btn ghost" id="d-levels">Tracks</button></div>
  </div>
</div>

<div id="rotate" hidden>
  <div class="ph"></div>
  <p><b>Turn your phone sideways</b><br>Throttle Hills plays in landscape.</p>
  <button class="btn ghost" id="rotate-ok">Play anyway</button>
</div>
<button class="icon" id="mute" aria-label="Sound on or off">🔊</button>

<script src="core.js"></script>
<script src="game.js"></script>
</body>
</html>
