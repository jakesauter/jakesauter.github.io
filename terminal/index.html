<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow"><meta name="referrer" content="no-referrer">
<title>Terminal</title>
<style>
:root{--bg:#faf9f5;--card:#fff;--text:#1f1e1d;--muted:#6b6a66;--line:#e3e0d6;--accent:#c96442}
@media (prefers-color-scheme:dark){:root{--bg:#262624;--card:#30302e;--text:#ece9e1;--muted:#a29f97;--line:#3b3a37;--accent:#d97757}}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,sans-serif;padding:16px;box-sizing:border-box}
.c{max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px}
h1{font:600 24px Georgia,serif;margin:0 0 6px}p{color:var(--muted);margin:0 0 18px}
a.b{display:block;text-align:center;background:var(--accent);color:#fff;text-decoration:none;font-weight:600;padding:11px;border-radius:10px}
small{display:block;margin-top:14px;color:var(--muted);word-break:break-all}
</style></head><body><div class="c"><h1>Terminal</h1>
<p>Private remote access. The sign-in page is served by the desktop itself.</p>
<a class="b" href="https://rt-gateway.jake-sauter3.workers.dev/" rel="noreferrer">Open</a>
<small>Check the address bar shows rt-gateway.jake-sauter3.workers.dev before signing in.</small>
</div></body></html>
